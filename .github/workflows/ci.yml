name: ci

on:
  push:
    branches: [main, hermes/**]
  pull_request:
    branches: [main]

# Cancel in-flight runs on the same ref when a new commit lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-register-readiness:
    name: Register readiness (install, tests, mock run, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and optional extras
        run: |
          python -m pip install --upgrade pip
          # -e the package under test, plus the receipts and eth optional
          # deps so the integration tests can import them. inspect_ai is
          # declared as a runtime dependency in pyproject.toml.
          python -m pip install -e ".[receipts,eth]"
          python -m pip install pytest

      - name: Run receipt integration test
        # This test runs in a subprocess; it patches inspect_receipts at
        # import time. The run is bounded (limit=2) and uses mockllm.
        run: pytest tests/test_receipt_integration.py -v

      - name: Run ETH annex test
        # Pure-Python EIP-712 reference implementation; 8 spec-invariant
        # assertions. See UK_DRAFTS/ETH_RECEIPTS_ANNEX.md.
        run: pytest tests/test_eth_receipt.py -v

      - name: Run probe smoke test
        # 9 protocol probes (A2A, MCP, did:web, root, x402, etc.) with a
        # local stdlib stub server (probes/_stub_server.py) and live-captured
        # fixtures (probes/_fixtures/). No external network access required.
        # 3 tests + 20 subtests; covers module imports, fixture presence,
        # and per-probe scorer correctness against the stub fixtures.
        run: pytest tests/test_probe_smoke.py -v

      - name: Run scripts/verify_register.sh
        # Runs every @task under mockllm/model with --limit 2. Exits non-zero
        # if any task fails to load, build, or run. Generates logs/ on the
        # runner (gitignored) so the run is reproducible by a reviewer.
        run: bash scripts/verify_register.sh

      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build --sdist --wheel

      - name: Upload build artefacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
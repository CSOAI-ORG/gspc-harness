name: ci

on:
  push:
    branches: [main, hermes/**]
  pull_request:
    branches: [main]

# Cancel in-flight runs on the same ref when a new commit lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-register-readiness:
    name: Register readiness (install, tests, mock run, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and receipts integration extra
        run: |
          python -m pip install --upgrade pip
          # -e the package under test, plus the receipts optional dep so the
          # integration test can import inspect_receipts. inspect_ai is
          # declared as a runtime dependency in pyproject.toml.
          python -m pip install -e ".[receipts]"
          python -m pip install pytest

      - name: Run receipt integration test
        # This test runs in a subprocess; it patches inspect_receipts at
        # import time. The run is bounded (limit=2) and uses mockllm.
        run: pytest tests/test_receipt_integration.py -v

      - name: Run scripts/verify_register.sh
        # Runs every @task under mockllm/model with --limit 2. Exits non-zero
        # if any task fails to load, build, or run. Generates logs/ on the
        # runner (gitignored) so the run is reproducible by a reviewer.
        run: bash scripts/verify_register.sh

      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build --sdist --wheel

      - name: Upload build artefacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gspc-harness"
version = "0.1.0"
description = "CSOAI GSPC governance benchmarks as runnable Inspect evals (EU AI Act risk-tier classification and agentic provision lookup)."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "CSOAI" }]
keywords = ["ai-governance", "eu-ai-act", "benchmark", "inspect-ai", "evaluation"]
dependencies = ["inspect_ai>=0.3"]

[project.optional-dependencies]
openai = ["openai>=1.0"]
# `inspect-signed-receipt` is the PyPI distribution of `inspect-receipts`. It is
# pulled in only by tests/test_receipt_integration.py; `pip install -e .` alone
# does not require it. The integration test installs `inspect_receipts` as
# ``inspect-signed-receipt`` (same package; see PyPI for the wheel name).
receipts = ["inspect-signed-receipt>=0.2"]

[project.urls]
Homepage = "https://csoai.org"
Repository = "https://github.com/CSOAI-ORG/gspc-harness"

# This repository is a flat layout of *task files* and *data files*. There is no
# importable Python package by design: `inspect eval tasks/<file>.py` is the
# usage pattern, and the harness relies on the user having `tasks/` on sys.path
# (the README walks through this). Pin a `setuptools` lower bound that does not
# enable the auto-discovery safety check (>= 61 was the floor; >= 77 makes the
# auto-discovery warning into an error which breaks this flat layout); and
# declare no packages explicitly so the build does not refuse on grounds of
# accidental top-level package discovery.
[tool.setuptools]
packages = []
py-modules = []
include-package-data = false
